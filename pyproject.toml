[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "system-budget-studio"
version = "1.9.0"
description = "Offline desktop tool for satellite power, mass, thermal and RF-link budgets."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials>=6.10.1,<6.11",
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.18,<0.20",
    "pint>=0.24,<0.27",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "python-docx>=1.1,<2",
    "pillow>=11.3,<13",
    "numpy>=2.3.2,<3",
    "sgp4>=2.25,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "pypdf>=5",
    "jsonschema>=4.23",
    "mypy>=1.18",
    "ruff>=0.6",
    "pyinstaller>=6.15",
    "cyclonedx-bom>=4.5",
    "pip-licenses>=5",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
]

[project.scripts]
budget = "budget_cli.main:main"

[project.gui-scripts]
system-budget-studio = "budget_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_core", "src/budget_cli", "src/budget_gui"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "budget_core/assets"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/budget_gui/*" = ["N802"]  # Qt method names

[tool.ruff.lint.isort]
known-first-party = ["budget_core", "budget_cli", "budget_gui", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["budget_core", "budget_cli", "budget_gui"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "ruamel.*", "pint.*", "jsonschema.*", "openpyxl.*", "reportlab.*", "pypdf.*", "sgp4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: needs a Qt platform (run with QT_QPA_PLATFORM=offscreen)",
    "perf: performance targets",
    "slow: takes more than about 15 seconds on its own (deselect with -m \"not slow\" for a quick loop; CI runs them)",
]
