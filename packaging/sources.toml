# The exact source code of the LGPL components in the installers (protection programme, phase 4).
#
# The release build downloads these archives (packaging/fetch_sources.py), checks the SHA-256 that
# the Qt project publishes next to each archive, attaches them to the GitHub release and takes the
# third-party notices of Qt out of the first one. The versions must equal the PySide6 version in
# requirements.lock (a test checks it): when PySide6 is updated, update this file in the same change.
#
# PySide6-Essentials 6.10.3 contains Qt 6.10.3. The bundle holds QtCore, QtGui, QtWidgets, QtDBus,
# the xcb and wayland platform plugins and the OpenGL support (packaging/bundle_policy.toml): they
# are in qtbase and qtwayland. shiboken6 and PySide6 are in pyside-setup.

[[source]]
name = "qtbase"
version = "6.10.3"
url = "https://download.qt.io/archive/qt/6.10/6.10.3/submodules/qtbase-everywhere-src-6.10.3.tar.xz"
sha256 = "383dc907816338f0cba72088a524c07458dfc69ce684ca9132fcc4fe91c24b0b"
sha256_published_at = "https://download.qt.io/archive/qt/6.10/6.10.3/submodules/qtbase-everywhere-src-6.10.3.tar.xz.sha256"
used_for = "Qt libraries QtCore, QtGui, QtWidgets, QtDBus, QtXcbQpa, QtOpenGL and the platform plugins"
notices = true

