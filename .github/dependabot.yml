# Version updates (D-263). Dependabot opens a pull request; a person reads it, and merges it only
# when the tests pass. Nothing is merged by itself.
#
# - github-actions: the actions in .github/workflows are pinned to a full commit id with the version
#   in a comment; Dependabot moves both together.
# - pip: reads pyproject.toml (the allowed ranges). The hashed lock files are made by
#   packaging/lock.sh with uv, which Dependabot does not run: after a pyproject.toml change, run
#   packaging/lock.sh and commit the lock files. pip-audit checks the lock files every week
#   (.github/workflows/audit.yml), which is the check for known vulnerabilities.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns: ["*"]
    # A major version, or a new Qt minor version, can change a report or the window. Such an
    # upgrade is done by hand in its own pull request: new lock files, the full suite, the golden
    # reports compared and a decision entry (a range change alone is not tested by CI, which
    # installs from the locks; see the closed pull request 138 and D-202).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "PySide6-Essentials"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
