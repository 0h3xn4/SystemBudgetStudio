name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Runtime-only install must give a runnable CLI
        run: |
          python -m venv rt
          rt/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/pip install -e .
          rt/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/budget --version
      - name: A regular (non-editable) install ships its data files (fonts, schemas, guide chapters)
        run: |
          python -m venv rt2
          rt2/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/pip install .
          rt2/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/budget self-test
      - name: Install dev tooling from hashed lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Offline test
        run: pytest tests/offline

  reuse:
    name: REUSE (licence and copyright of every file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The reuse tool needs libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install from the hashed lock
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Every file has an SPDX licence and a copyright line (REUSE specification)
        run: reuse lint

  offline-evidence-linux:
    name: Offline evidence (Linux, strace)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: strace and the Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y strace libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install from the hashed lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Whole workflow and the window under strace; fails on any connection to an internet address
        run: python scripts/verify_offline.py --gui "$(which system-budget-studio)"

  offline-evidence-windows:
    name: Offline evidence (Windows, outbound firewall block)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install from the hashed lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Block all outbound traffic of the Python programs in the Windows firewall
        shell: pwsh
        run: |
          $programs = @(
            (python -c "import sys; print(sys.executable)"),
            (python -c "import sys; print(sys._base_executable)")
          ) | Sort-Object -Unique
          foreach ($program in $programs) {
            New-NetFirewallRule -DisplayName "block-python-out $program" -Direction Outbound `
              -Program $program -Action Block -Profile Any | Out-Null
            Write-Host "blocked: $program"
          }
      - name: Control - a connection to the internet must now fail (otherwise the block proves nothing)
        shell: pwsh
        run: |
          python -c "import urllib.request; urllib.request.urlopen('https://example.com', timeout=15)"
          if ($LASTEXITCODE -eq 0) { Write-Error "the control connection succeeded: the firewall rule does not work"; exit 1 }
          Write-Host "control connection failed, as expected"
          $global:LASTEXITCODE = 0
      - name: Whole workflow with the block in place
        run: python scripts/verify_offline.py
