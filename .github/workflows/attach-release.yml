name: Attach release files

# Attaches the files of a finished "Installers" run to the release of a tag. Use it when a tag was
# built before the release job existed, or to repeat the upload. Start it by hand (Actions >
# Attach release files > Run workflow). Nothing is published: a missing release is created as a
# draft, and files already attached are replaced.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the Installers run (the number in the run's address)"
        required: true
      tag:
        description: "Tag of the release, for example v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the files and attach them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: packaging/attach_release.sh "$RUN_ID" "$TAG"
