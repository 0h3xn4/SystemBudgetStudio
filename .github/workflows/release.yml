name: Installers

# Builds the Linux bundle on Rocky Linux 9 and the Windows installer, installs each as an ordinary
# user and uninstalls it again, and makes the .deb and .rpm packages of the Linux bundle and installs
# and removes them on clean Ubuntu, Debian and Rocky containers. Runs on tags (release artefacts) and on pull requests that touch
# the packaging, so installer changes are verified before they are merged.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "requirements*.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (built on Rocky 9; tarball, .deb and .rpm tested on Rocky, Ubuntu and Debian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build, install and uninstall on Rocky Linux 9 (container, unprivileged user)
        run: |
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src rockylinux:9 bash packaging/linux/build_in_container.sh
      - name: Install, self-test and uninstall on the Ubuntu runner (no sudo)
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          work="$(mktemp -d)"
          tar -C "$work" -xzf dist/system-budget-studio-*-linux-x86_64.tar.gz
          export HOME="$work/home"; mkdir -p "$HOME"
          "$work/system-budget-studio/install.sh"
          export PATH="$HOME/.local/bin:$PATH"
          budget --version
          budget self-test
          QT_QPA_PLATFORM=offscreen system-budget-studio --smoke
          python3 packaging/check_bundle.py "$HOME/.local/opt/system-budget-studio"
          "$HOME/.local/opt/system-budget-studio/uninstall.sh"
          test ! -e "$HOME/.local/opt/system-budget-studio"
      - name: Install, check and remove the .deb and the .rpm on clean systems (root, containers)
        run: |
          set -e
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "::group::.deb on $image"
            docker run --rm -v "$PWD":/src -w /src "$image" \
              sh packaging/linux/test_package.sh deb dist/system-budget-studio_*_amd64.deb
            echo "::endgroup::"
          done
          for image in rockylinux:9; do
            echo "::group::.rpm on $image"
            docker run --rm -v "$PWD":/src -w /src "$image" \
              sh packaging/linux/test_package.sh rpm dist/system-budget-studio-*.x86_64.rpm
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-budget-studio-Linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
            dist/licences.md
            dist/THIRD_PARTY_NOTICES.txt
            dist/sources/*

  windows:
    name: Windows (per-user installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build the bundle
        shell: bash
        run: packaging/build.sh
      - name: Build the installer and the portable zip
        shell: pwsh
        run: |
          $version = python -c "from budget_core import __version__; print(__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DBundleDir=$PWD\dist\system-budget-studio" "/DOutputDir=$PWD\dist" packaging\windows\system_budget_studio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\system-budget-studio -DestinationPath "dist\system-budget-studio-$version-windows-x64-portable.zip"
          Get-ChildItem dist\*-setup.exe, dist\*-portable.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Encoding ascii dist\SHA256SUMS.txt
          }
      - name: Silent per-user install, self-test, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "sbs"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/DIR=$target","/LOG=$env:RUNNER_TEMP\setup.log"
          & "$target\budget.exe" --version
          & "$target\budget.exe" self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }
          $gui = Start-Process -Wait -PassThru -FilePath "$target\system-budget-studio.exe" -ArgumentList "--self-test"
          if ($gui.ExitCode -ne 0) { throw "GUI self-test failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $smoke = Start-Process -Wait -PassThru -FilePath "$target\system-budget-studio.exe" -ArgumentList "--smoke"
          if ($smoke.ExitCode -ne 0) { throw "GUI smoke test failed (the window could not be created)" }
          Start-Process -Wait -FilePath "$target\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
          if (Test-Path "$target\budget.exe") { throw "uninstall left the program behind" }
      - name: The setup adds and removes exactly one PATH entry, and an upgrade leaves no stale file
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "sbs-path"
          $before = (Get-ItemProperty -Path HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/DIR=$target"
          $during = (Get-ItemProperty -Path HKCU:\Environment -Name Path).Path
          if (($during -split ";") -notcontains $target) { throw "the setup did not add the folder to PATH" }
          New-Item -ItemType File -Force -Path "$target\_internal\stale-from-an-old-version.txt" | Out-Null
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/DIR=$target"
          if (Test-Path "$target\_internal\stale-from-an-old-version.txt") { throw "the upgrade left a stale file behind" }
          if ((($(Get-ItemProperty -Path HKCU:\Environment -Name Path).Path) -split ";" | Where-Object { $_ -eq $target }).Count -ne 1) { throw "the upgrade duplicated the PATH entry" }
          Start-Process -Wait -FilePath "$target\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
          $after = (Get-ItemProperty -Path HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
          if (($after -split ";") -contains $target) { throw "uninstall left the PATH entry behind" }
          if ($after -ne $before) { Write-Host "PATH differs from before: '$before' -> '$after'" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-budget-studio-Windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
            dist/licences.md
            dist/THIRD_PARTY_NOTICES.txt

  publish:
    name: Attach the files to the release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The owner adds a required reviewer to this environment (Settings > Environments > release),
    # so nothing is attached to a release before a person approves it (docs/developer/security.md).
    environment: release
    permissions:
      contents: write   # upload to the release
      actions: read     # download the artefacts of this run
      id-token: write   # sign the attestations of the files (sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Checks for the compliance record (REUSE and pip-audit; the result is written down, a failure does not stop the upload)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          mkdir -p "$RUNNER_TEMP/checks"
          set +e
          reuse lint > "$RUNNER_TEMP/checks/reuse.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/checks/reuse.exit"
          pip-audit -r requirements.lock --require-hashes --disable-pip > "$RUNNER_TEMP/checks/pip-audit.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/checks/pip-audit.exit"
          tail -n 5 "$RUNNER_TEMP/checks/reuse.txt" "$RUNNER_TEMP/checks/pip-audit.txt"
          exit 0
      - name: Check the files and attach them (a missing release is created as a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SBS_CHECK_DIR: ${{ runner.temp }}/checks
        run: packaging/attach_release.sh "$GITHUB_RUN_ID" "$GITHUB_REF_NAME"
      - name: Download the files again for the build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/attest"
      - name: Attest where the files were built (verify with gh attestation verify)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/attest/**/*-setup.exe
            ${{ runner.temp }}/attest/**/*-portable.zip
            ${{ runner.temp }}/attest/**/*.tar.gz
            ${{ runner.temp }}/attest/**/*.deb
            ${{ runner.temp }}/attest/**/*.rpm
            ${{ runner.temp }}/attest/**/sbom.cdx.json
