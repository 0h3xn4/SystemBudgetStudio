name: Dependency review

# On a pull request that changes the dependencies: fails when the change adds a package with a
# known vulnerability of high or critical severity. (The weekly pip-audit run covers the packages
# that are already there: .github/workflows/audit.yml.)
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
