name: Dependency review

# Fails when a change adds a package with a known vulnerability of high or critical severity.
# It needs the repository's Dependency graph (Settings > Code security), switched on by the owner
# on 2026-11-11. It runs on the pull requests that change a dependency or a workflow; the weekly
# pip-audit run (audit.yml) checks the locked packages in every case and on every lock change.
on:
  pull_request:
    paths: ["pyproject.toml", "requirements*.lock", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
