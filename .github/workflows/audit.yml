name: Dependency audit

# Checks the locked runtime and development dependencies against the public vulnerability database
# (pip-audit, PyPI advisories and OSV). It runs every week, because an advisory can appear without a
# change in the repository, whenever a lock file or the dependency list changes, and on request. A
# finding fails the run; the log names the package, the advisory and the version that fixes it.
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "requirements*.lock"
      - "pyproject.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit of the lock files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pip-audit from the hashed lock
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit the runtime lock (what the installers contain)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Audit the development lock (what builds and tests the program)
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip
